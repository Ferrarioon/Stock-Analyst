<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Analyst — broker target prices, checked</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/"><span class="logo"></span><span>Stock Analyst</span></a>
    <nav id="nav">
      <a href="#/" data-r="home"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a href="#/stocks" data-r="stocks"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>Stocks</a>
      <a href="#/latest" data-r="latest"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Latest reports</a>
      <a href="#/brokers" data-r="brokers"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Broker accuracy</a>
      <a href="#/method" data-r="method"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>How it works</a>
    </nav>
    <div class="side-foot">
      <button class="btn ghost" id="signin">Sign in</button>
      <p>Independent research from public broker reports. Not investment advice.</p>
    </div>
  </aside>
  <main id="view"><p class="loading">Loading data…</p></main>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-card glass">
    <h3>Accounts are coming soon</h3>
    <p>Everything on the site is free to use without signing in for now. Accounts will be added later.</p>
    <button class="btn" id="modal-close">OK</button>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
